<section data-anim="moodgrid" class="bg-wm" data-label="45 Direction B — Mood">

    .dbm-cell {

      overflow: hidden;
    }
    .dbm-cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .dbm-cell-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      pointer-events: none;
    }
    .dbm-cell-label {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-size: 24px;
      color: rgba(0, 0, 0, 0.25);
      letter-spacing: 0.06em;
    }
    .dbm-cell-label--lt {
      color: rgba(255, 255, 255, 0.45);
    }
    .dbm-cell-grad-dark {
      background: linear-gradient(135deg, #1a1816 0%, #2e2a24 100%);
    }
    .dbm-cell-grad-tan {
      background: linear-gradient(135deg, #c8b89a 0%, #a89070 100%);

    .dbm-cell-b {
      background: var(--td);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dbm-cell-b-letter {

      font-size: 180px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.12);

      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.06em;
    }
    .dbm-direction-label {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--fe);
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.55);

      <img src="/images/direction-b-mood-culture.webp" alt="文化">
