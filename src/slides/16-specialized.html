<style>
  .sp-layout {
    display: grid;
    grid-template-columns: 55% 45%;
    height: 100%;
  }
  .sp-img-panel {
    position: relative;
    overflow: hidden;
  }
  .sp-collage {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-rows: 58% 42%;
    gap: 3px;
  }
  .sp-collage-top {
    position: relative;
    overflow: hidden;
  }
  .sp-collage-bottom {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3px;
  }
  .sp-collage-cell {
    position: relative;
    overflow: hidden;
  }
  .sp-collage-split {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3px;
  }
  .sp-collage img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }
  .sp-info {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 60px 80px 60px 68px;
    border-left: 1px solid rgba(255,255,255,.05);
  }
  .sp-tier {
    font-family: var(--fn);
    font-size: 14px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--am);
    margin-bottom: 18px;
  }
  .sp-logo {
    height: 120px;
    width: auto;
    display: block;
    margin: 0 0 20px;
  }
  .sp-wordmark {
    height: 42px;
    width: auto;
    display: block;
    opacity: .85;
    margin: 0 0 14px;
  }
  .sp-meta {
    font-family: var(--fn);
    font-size: 15px;
    color: rgba(255,255,255,.35);
    letter-spacing: .05em;
  }
  .sp-tagline {
    font-family: var(--fc);
    font-size: 24px;
    line-height: 1.6;
    color: rgba(255,255,255,.82);
    border-left: 2px solid var(--am);
    padding-left: 20px;
  }
  .sp-values {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .sp-value {
    display: grid;
    grid-template-columns: 130px 1fr;
    align-items: baseline;
    gap: 16px;
  }
  .sp-value-name {
    font-family: var(--fn);
    font-size: 13px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: rgba(255,255,255,.4);
  }
  .sp-value-desc {
    font-family: var(--fc);
    font-size: 20px;
    line-height: 1.5;
    color: rgba(255,255,255,.72);
  }
  .sp-divider {
    width: 100%;
    height: 1px;
    background: rgba(255,255,255,.07);
  }
</style>

<section data-anim="default" class="bg-dk" data-label="15 Specialized — Brand Overview">
  <div class="sp-layout">
    <div class="sp-img-panel">
      <div class="sp-collage">
        <div class="sp-collage-top">
          <img src="/images/specialized/specialized-hero.jpg" alt="Specialized Hero">
        </div>
        <div class="sp-collage-bottom">
          <div class="sp-collage-split">
            <div class="sp-collage-cell">
              <img src="/images/specialized/specialized-road.webp" alt="Specialized Road Bikes">
            </div>
            <div class="sp-collage-cell">
              <img src="/images/specialized/specialized-mountain.webp" alt="Specialized Mountain Bikes">
            </div>
          </div>
          <div class="sp-collage-cell">
            <img src="/images/specialized/specialized-sworks.webp" alt="S-Works">
          </div>
        </div>
      </div>
    </div>
    <div class="sp-info">
      <div class="sp-head">
        <div class="sp-tier">整车品牌 · Layer 01</div>
        <img src="/images/logos/specialized-white.svg" class="sp-logo" alt="Specialized">
        <img src="/images/logos/specialized-wordmark-white.svg" class="sp-wordmark" alt="Specialized Wordmark">
        <div class="sp-meta">Est. 1974 · Morgan Hill, CA · Premium Bicycle & Cycling Gear</div>
      </div>

      <div class="sp-tagline">
        由骑手创立、为骑手打造——<br>以赛场验证的顶尖技术，<br>重新定义每一段骑行体验
      </div>

      <div>
        <div class="sp-divider" style="margin-bottom:24px;"></div>
        <div class="sp-values">
          <div class="sp-value">
            <div class="sp-value-name">Rider-First</div>
            <div class="sp-value-desc">一切产品与创新皆从骑手的真实需求出发</div>
          </div>
          <div class="sp-value">
            <div class="sp-value-name">Innovation</div>
            <div class="sp-value-desc">不断突破技术边界，追求极致空气动力学与轻量化</div>
          </div>
          <div class="sp-value">
            <div class="sp-value-name">Sustainability</div>
            <div class="sp-value-desc">减少环境足迹，推动骑行作为健康环保的生活方式</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
