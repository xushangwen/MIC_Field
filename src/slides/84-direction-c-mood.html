<section data-anim="moodgrid" class="bg-dk" data-label="47 Direction C — Mood">
  <style>
    .dcm-grid {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }
    .dcm-cell {
      position: relative;
      overflow: hidden;
    }
    .dcm-cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .dcm-cell-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      pointer-events: none;
    }
    .dcm-cell-label {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-size: 24px;
      opacity: 0.5;
      letter-spacing: 0.06em;
    }
    .dcm-cell-am {
      background: var(--am);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dcm-cell-am-letter {
      font-family: var(--fe);
      font-size: 180px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.2);
    }
    .dcm-direction-label {
      background: linear-gradient(135deg, #080604 0%, #1e1008 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--fe);
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.55);
    }
  </style>

  <div class="dcm-grid">
    <div class="dcm-cell">
      <img decoding="async" src="/images/direction-c-mood-wind.webp" alt="逆风">
      <div class="dcm-cell-overlay"></div>
      <div class="dcm-cell-label">逆风</div>
    </div>
    <div class="dcm-cell">
      <img decoding="async" src="/images/direction-c-mood-sun.webp" alt="向阳">
      <div class="dcm-cell-overlay"></div>
      <div class="dcm-cell-label">向阳</div>
    </div>
    <div class="dcm-cell">
      <img decoding="async" src="/images/direction-c-mood-coast.webp" alt="持续">
      <div class="dcm-cell-overlay"></div>
      <div class="dcm-cell-label">持续</div>
    </div>
    <div class="dcm-cell">
      <img decoding="async" src="/images/direction-c-mood-motion.webp" alt="移动">
      <div class="dcm-cell-overlay"></div>
      <div class="dcm-cell-label">移动</div>
    </div>
    <div class="dcm-cell dcm-cell-am">
      <div class="dcm-cell-am-letter">C</div>
    </div>
    <div class="dcm-cell dcm-direction-label">
      Sunward Motion
    </div>
  </div>
</section>
